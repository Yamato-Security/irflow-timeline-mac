# Yamato Security fork — unsigned (ad-hoc signed) universal macOS builds.
#
# Every pull request and every push to main builds the renderer, runs the test suite,
# bundles Hayabusa + bmc-tools and packages IRFlow Timeline as a universal
# (Apple silicon + Intel) app: a zip and a dmg under the run's Artifacts.
#
# Releases — two ways, both end in a DRAFT GitHub release `v<package.json version>` that
# you review and publish:
#   * Actions → "Build macOS (unsigned)" → Run workflow on main → tick "Create draft release".
#     Publishing that draft creates the tag at the built commit. The tag push builds once more,
#     but a published release keeps the files it was published with.
#   * Push a tag `v<version>` that matches package.json.
# Bump "version" in package.json (and package-lock.json) before releasing again.
#
# Nothing here is notarized or Developer-ID signed, so macOS blocks the first launch:
# System Settings → Privacy & Security → Open Anyway, or
#   xattr -dr com.apple.quarantine "/Applications/IRFlow Timeline.app"
# Upstream's signed release pipeline (Apple notarization, S3 updater feed) needs credentials
# this fork does not have, so it is not part of this repository.
name: Build macOS (unsigned)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      draft_release:
        description: "Create draft release: build this commit and attach it to the draft GitHub release v<package.json version>"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-macos-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build universal app
    # macos-14 is an Apple-silicon runner; electron-builder produces the x64 and arm64
    # sub-builds and merges them, and `lipo` makes the bundled Hayabusa universal too.
    runs-on: macos-14
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.meta.outputs.artifact }}
      release: ${{ steps.meta.outputs.release }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.17.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Smoke Electron runtime (DuckDB engine, SQLite readers)
        run: npm run smoke:electron

      - name: Run test suite
        timeout-minutes: 15
        run: npm test

      - name: Build renderer
        run: npm run build:renderer

      - name: Bundle external tools (Hayabusa + bmc-tools)
        env:
          # Authenticated GitHub API lookups: shared runner IPs exhaust the anonymous limit.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npm run bundle:tools
          echo "==> Verifying bundled tools"
          test -f hayabusa/hayabusa || { echo "::error::hayabusa binary missing after bundle"; exit 1; }
          test -d hayabusa/rules    || { echo "::error::hayabusa rules dir missing after bundle"; exit 1; }
          test -f tools/bmc-tools/bmc-tools.py || { echo "::error::bmc-tools.py missing after bundle"; exit 1; }
          lipo -info hayabusa/hayabusa
          lipo -info hayabusa/hayabusa | grep -q "x86_64 arm64\|arm64 x86_64" \
            || { echo "::error::hayabusa binary is not a universal (x86_64+arm64) fat binary"; exit 1; }

      - name: Build metadata
        id: meta
        shell: bash
        env:
          # On pull_request events GITHUB_SHA is the synthetic merge commit; label the build
          # with the commit that is actually on the branch.
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DRAFT_RELEASE: ${{ inputs.draft_release }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          sha="${PR_HEAD_SHA:-${GITHUB_SHA}}"
          release="false"
          tag=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version} (expected v${version})"
              exit 1
            fi
            release="true"
            tag="${GITHUB_REF_NAME}"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${DRAFT_RELEASE}" = "true" ]; then
            release="true"
            tag="v${version}"
          fi
          # Release builds carry the plain version; development builds add the commit.
          if [ "${release}" = "true" ]; then suffix=""; else suffix="+g${sha::7}"; fi
          echo "Building ${version}${suffix} (release=${release}${tag:+, tag ${tag}})"
          {
            echo "suffix=${suffix}"
            echo "artifact=irflow-timeline-mac-${version}${suffix//+/-}-macos-universal"
            echo "release=${release}"
            echo "tag=${tag}"
          } >> "${GITHUB_OUTPUT}"

      - name: Package unsigned universal app (zip + dmg)
        env:
          BUILD_SUFFIX: ${{ steps.meta.outputs.suffix }}
        run: bash scripts/package-unsigned-mac.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: release/unsigned/
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: Draft GitHub release
    if: needs.build.outputs.release == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: release-files

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          ls -la release-files
          # "true" (draft), "false" (published) or "missing".
          state="$(gh release view "${TAG}" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
          if [ "${state}" = "missing" ]; then
            # --target pins the commit; GitHub creates the tag there when the draft is published.
            gh release create "${TAG}" --draft --generate-notes --target "${GITHUB_SHA}" \
              --title "IRFlow Timeline ${TAG#v} (Yamato Security fork, unsigned)"
          elif [ "${state}" = "false" ]; then
            if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
              # Publishing a draft creates its tag, and that tag push runs this workflow again.
              # The published release already has the files that were reviewed; keep them.
              echo "::notice::Release ${TAG} is already published; its files are left unchanged."
              exit 0
            fi
            echo "::error::Release ${TAG} is already published. Bump \"version\" in package.json (and package-lock.json) before building another release."
            exit 1
          fi
          gh release upload "${TAG}" release-files/* --clobber
          echo "Draft release: $(gh release view "${TAG}" --json url --jq .url)"
